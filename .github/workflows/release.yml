---
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MINIMUM_PYTHON_VERSION: "3.11"
  # abi3t starts here; Python 3.14t is built separately as legacy.
  MINIMUM_FT_PYTHON_VERSION: "3.15"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Require a version tag matching the package
        run: |
          python3 - <<'PYTHON'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          component = r"(0|[1-9][0-9]*)"
          version_pattern = rf"v{component}\.{component}\.{component}"
          if (
              os.environ["GITHUB_REF_TYPE"] != "tag"
              or re.fullmatch(version_pattern, tag) is None
          ):
              raise SystemExit("release requires a tag named vA.B.C")

          package = tomllib.loads(Path("Cargo.toml").read_text())["package"]
          if tag != f"v{package['version']}":
              raise SystemExit(
                  "release tag does not match the Cargo package version"
              )
          PYTHON

  # ======================================== #
  # Python SDist
  # ======================================== #
  build-python-sdist:
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the toolchain declared by rust-toolchain.toml
        run: rustup show

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist
          if-no-files-found: error

  # ======================================== #
  # Python Wheels
  # ======================================== #
  build-python-abi3-wheels:
    name: abi3 (${{ matrix.platform.family }}, ${{ matrix.platform.target }})
    needs: validate-release
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        # One abi3 wheel per platform supports the minimum Python and newer.
        platform:
          - runner: ubuntu-latest
            target: x86_64
            family: manylinux
          - runner: ubuntu-latest
            target: x86
            family: manylinux
          - runner: ubuntu-latest
            target: aarch64
            family: manylinux
          - runner: ubuntu-latest
            target: armv7
            family: manylinux
          - runner: ubuntu-latest
            target: ppc64le
            family: manylinux
          - runner: ubuntu-latest
            target: ppc64
            family: manylinux
          - runner: ubuntu-latest
            target: x86_64
            family: musllinux
          - runner: ubuntu-latest
            target: x86
            family: musllinux
          - runner: ubuntu-latest
            target: aarch64
            family: musllinux
          - runner: ubuntu-latest
            target: armv7
            family: musllinux
          - runner: ubuntu-latest
            target: ppc64le
            family: musllinux
          - runner: windows-latest
            target: x86_64
            family: windows
          - runner: windows-latest
            target: x86
            family: windows
          - runner: windows-11-arm
            target: aarch64
            family: windows
          - runner: macos-latest
            target: x86_64
            family: macos
          - runner: macos-latest
            target: aarch64
            family: macos

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
          python-version: ${{ env.MINIMUM_PYTHON_VERSION }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: >-
            --locked --release --features
            abi3,sparse-direct,pyo3/extension-module --out dist --interpreter
            python${{ env.MINIMUM_PYTHON_VERSION }}
          manylinux: >-
            ${{ matrix.platform.family == 'musllinux' && 'musllinux_1_2' ||
            'auto' }}
          sccache: false

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name:
            wheels-abi3-${{ matrix.platform.family }}-${{ matrix.platform.target
            }}
          path: dist
          if-no-files-found: error

  build-python-freethreaded-wheels:
    name:
      ${{ matrix.abi }} (${{ matrix.platform.runner }}, ${{
      matrix.platform.target }})
    needs: validate-release
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64
          - runner: windows-latest
            target: x86_64
          - runner: macos-latest
            target: x86_64
          - runner: macos-latest
            target: aarch64
        # Legacy has no stable ABI; abi3t covers the configured minimum onward.
        abi: [abi3t, legacy-3.14t]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select free-threaded Python
        id: python
        shell: bash
        env:
          ABI: ${{ matrix.abi }}
        run: |
          if [ "$ABI" = "abi3t" ]; then
            echo "version=${MINIMUM_FT_PYTHON_VERSION}t" >> "$GITHUB_OUTPUT"
          else
            echo "version=3.14t" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
          python-version: ${{ steps.python.outputs.version }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: >-
            --locked --release ${{ matrix.abi == 'abi3t' && '--features
            abi3t,sparse-direct,pyo3/extension-module' || '' }} --out dist
            --interpreter python${{ steps.python.outputs.version }}
          manylinux: auto
          sccache: false

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name:
            wheels-freethreaded-${{ matrix.platform.runner }}-${{
            matrix.platform.target }}-${{ matrix.abi }}
          path: dist
          if-no-files-found: error

  # ======================================== #
  # Rust Crate
  # ======================================== #
  build-rust-crate:
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the toolchain declared by rust-toolchain.toml
        run: rustup show

      - name: Test and package the Rust core
        run: |
          cargo test --locked --all-features
          cargo package --locked -p cave-closure
          cargo package --locked -p cave-closure --list

      - name: Upload crate
        uses: actions/upload-artifact@v7
        with:
          name: crate
          path: target/package/*.crate
          if-no-files-found: error

  # ======================================== #
  # Verification
  # ======================================== #
  verify-artifacts:
    needs:
      [
        build-python-abi3-wheels,
        build-python-freethreaded-wheels,
        build-python-sdist,
        build-rust-crate,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: crate
          path: crate

      - name: Verify packaged source correspondence and wheel contents
        run: |
          mkdir extracted provenance
          tar -xzf dist/*.tar.gz -C extracted --strip-components=1
          for wheel in dist/*.whl; do
            python3 extracted/tests/inspect_artifacts.py \
              --crate crate/*.crate --sdist dist/*.tar.gz --wheel "$wheel" \
              --output "provenance/$(basename "$wheel").json"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: artifact-provenance
          path: provenance
          if-no-files-found: error

  # ======================================== #
  # Publication
  # ======================================== #
  publish-crate:
    needs: verify-artifacts
    name: Release Crates.IO
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: crate
          path: tested-crate

      - name: Repackage and compare before authentication
        run: |
          rustup show
          cargo package --locked -p cave-closure
          cmp target/package/*.crate tested-crate/*.crate

      - name: Authenticate to crates.io using trusted publishing
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish the Rust core
        run: cargo publish --locked --no-verify -p cave-closure
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-release:
    needs: verify-artifacts
    name: Release PyPI.org
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
          verbose: true
          packages-dir: "dist"
