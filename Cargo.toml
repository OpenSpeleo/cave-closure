[package]
name = "cave-closure"
version = "0.0.3"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Explicit covariance-weighted cave survey loop closure in local ENU metres"
readme = "README.md"
# Keep reference papers and the generated fixture corpus out of crates.io uploads.
# Maturin includes the complete Python test corpus separately in its sdist.
include = [
    "/src_rust/**",
    "/src_python/**/*.py",
    "/src_python/**/*.pyi",
    "/src_python/**/py.typed",
    "/benches/**",
    "/examples/**",
    "/tests/*.rs",
    "/tests/fixtures/controlled_tree.json",
    "/schemas/**",
    "/docs/*.md",
    "/scripts/generate_stubs.py",
    "/pyproject.toml",
    "/rust-toolchain.toml",
    "/README.md",
    "/LICENSE",
]

[lib]
name = "cave_closure"
path = "src_rust/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
python = ["dep:pyo3", "dep:pyo3-stub-gen"]
generate-stubs = ["python"]
abi3 = ["python", "pyo3/abi3-py311"]
abi3t = ["python", "pyo3/abi3t-py315"]
sparse-direct = ["dep:faer"]
l1 = ["dep:highs-sys"]

[dependencies]
nalgebra = "0.35"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
schemars = "1"
ts-rs = { version = "7", features = ["no-serde-warnings"] }
faer = { version = "0.24", optional = true }
highs-sys = { version = "=1.14.3", optional = true }
pyo3 = { version = "0.30", optional = true }
pyo3-stub-gen = { version = "0.23.2", optional = true }

[target.'cfg(windows)'.dependencies.pyo3]
version = "0.30"
optional = true
features = ["generate-import-lib"]

[[bin]]
name = "stub_gen"
path = "src_rust/bin/stub_gen.rs"
doc = false
required-features = ["generate-stubs"]

[[bench]]
name = "networks"
harness = false

[[example]]
name = "fixture_results"
required-features = ["sparse-direct"]
