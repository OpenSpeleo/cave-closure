[workspace]
members = ["crates/cave_closure", "crates/cave_closure_py"]
default-members = ["crates/cave_closure"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
nalgebra = "0.35"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
schemars = "1"
