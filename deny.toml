[advisories]
unmaintained = "workspace"
# Remove resolved exceptions from both this file and .cargo/audit.toml.
ignore = []

[licenses]
allow = [
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
# Stub generation uses RustPython's parser and Unicode name data.
exceptions = [
  # L1's C bindings and their libclang loader are build-time dependencies.
  { crate = "bindgen", allow = ["BSD-3-Clause"] },
  { crate = "libloading", allow = ["ISC"] },
  { crate = "tiny-keccak", allow = ["CC0-1.0"] },
  { crate = "unicode_names2", allow = ["MIT", "Unicode-DFS-2016"] },
]

[sources]
allow-git = ["https://github.com/Jij-Inc/pyo3-stub-gen.git"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
