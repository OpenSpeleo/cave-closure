[build-system]
requires = ["maturin>=1.12,<2"]
build-backend = "maturin"

[project]
name = "cave-closure"
# Maturin reads the version from Cargo.toml.
dynamic = ["version"]
description = "Explicit covariance-weighted cave survey loop closure"
authors = [{ name = "Jonathan Dekhtiar", email = "jonathan@dekhtiar.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"

[project.optional-dependencies]
test = [
    "jsonschema>=4",
    "numpy>=2",
    "scipy>=1.17",
    "pytest>=8.0.0,<10", #
    "pytest-cov>=5.0.0,<8",
    "pytest-env>=1.1.3,<2",
    "pytest-runner>=6.0.0,<7",
    "pytest-ordering>=0.6,<1",
    "parameterized>=0.9.0,<1",
]

[dependency-groups]
dev = [
    "maturin>=1.12,<2",
    "prek>=0.4,<1",
    "ruff>=0.17,<1"
]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "rust-toolchain.toml" },
    { file = "src_rust/**/*" },
    { file = "src_python/**/*.py" },
    { file = "src_python/**/*.pyi" },
    { file = "src_python/**/py.typed" },
]

[tool.maturin]
features = ["python", "sparse-direct", "l1", "pyo3/extension-module"]
editable-profile = "dev"
python-source = "src_python"
module-name = "cave_closure._native"
include = [
    { path = "rust-toolchain.toml", format = "sdist" },
    { path = "tests/fixtures/*.json", format = "sdist" },
    { path = "tests/*.py", format = "sdist" },
    { path = "schemas/*.json", format = "sdist" },
    { path = "docs/*.md", format = "sdist" },
    { path = "LICENSE", format = "sdist" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
