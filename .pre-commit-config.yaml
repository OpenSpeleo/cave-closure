---
exclude: >-
  ^docs/|^target/|^.venv/|^.pytest_cache/|^uv.lock

default_language_version:
  python: python3.14

# ========================================================================= #
#                                 FORMATING                                 #
# ========================================================================= #

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^tests/fixtures/
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: detect-private-key

  # Markdown formatting
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.10.1
    hooks:
      - id: prettier
        name: prettier
        types_or: [markdown, toml, yaml, json]
        args: [--prose-wrap=always]

  # Run the Ruff linter.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      # Linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        exclude: ^tests/fixtures/
      # Formatter
      - id: ruff-format
        exclude: ^tests/fixtures/

  - repo: https://github.com/PyCQA/autoflake
    rev: v2.4.0
    hooks:
      - id: autoflake
        args:
          [
            "--in-place",
            "--remove-all-unused-imports",
            "--remove-unused-variables",
            "--expand-star-imports",
          ]
        additional_dependencies: ["autoflake"]

  # -------------------------
  # CI formatting
  # -------------------------
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        # Accept GitHub Actions `on` and capitalized YAML booleans.
        args:
          - --config-data
          - |
            extends: default
            rules:
              truthy:
                allowed-values: ['true', 'false', 'True', 'False', 'on']

  # ========================================================================= #
  #                           DEPENDENCY MANAGEMENT                           #
  # ========================================================================= #

  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.13.8
    hooks:
      - id: uv-lock
        args: ["--check"]

  # ========================================================================= #
  #                                 SECURITY                                  #
  # ========================================================================= #

  - repo: https://github.com/pycqa/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-iii", "-ll"]

  - repo: https://github.com/pysentry/pysentry-pre-commit
    rev: v0.5.0
    hooks:
      - id: pysentry
        args:
          [
            "--format=human",
            "--fail-on=medium",
            "--forbid-quarantined",
            "--sources=pypa,osv,pypi",
          ]

  # -------------------------
  # Security/License Check
  # -------------------------
  - repo: https://github.com/EmbarkStudios/cargo-deny
    rev: 0.20.2
    hooks:
      - id: cargo-deny
        args: [--locked, --all-features, check]
        always_run: true

  # -------------------------
  # Unused Dependency Check
  # -------------------------
  - repo: https://github.com/bnjbvr/cargo-machete
    rev: v0.9.2
    hooks:
      - id: cargo-machete
        args: [--with-metadata]

  # -------------------------
  # Rust Formatting
  # -------------------------

  - repo: local
    hooks:
      - id: rustfmt
        name: Rust formatting
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: clippy
        name: Rust Clippy
        entry:
          cargo clippy --locked --workspace --all-targets --all-features -- -D
          warnings
        language: system
        pass_filenames: false
        always_run: true

# sets up .pre-commit-ci.yaml to ensure pre-commit dependencies stay up to date
ci:
  autoupdate_schedule: weekly
  skip: []
  submodules: false
