[package]
name = "cave_closure_py"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[features]
abi3 = ["pyo3/abi3-py311"]
sparse-direct = ["cave_closure/sparse-direct"]

[dependencies]
cave_closure = { path = "../cave_closure" }
pyo3 = { version = "0.30", features = ["extension-module"] }
